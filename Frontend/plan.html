<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your trip plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./plan.css">
</head>
<body class="phone-page">
    <div class="phone">
        <header class="modal-header">
            <div class="header-spacer"></div>
            <div class="header-logo">
                <img src="https://companieslogo.com/img/orig/0293.HK-ef2d48dd.png?t=1746518351" alt="Cathay Pacific Logo">
            </div>
            <div class="header-actions">
                <a class="icon-btn" id="close-plan" href="./index.html?view=chat" title="Close">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333333' stroke-width='2.2'><line x1='18' y1='6' x2='6' y2='18'/><line x1='6' y1='6' x2='18' y2='18'/></svg>" alt="Close">
                </a>
            </div>
        </header>
        <script>
            document.getElementById("close-plan").addEventListener("click", function () {
                window.location.assign(new URL("index.html?view=chat", window.location.href).href);
            });
        </script>
        <main class="phone-main custom-scrollbar">
            <div id="plan"></div>
        </main>
    </div>
    <script src="./passenger-context.js"></script>
    <script src="./plan-data.js"></script>
    <script src="./plan-build.js"></script>
    <script>
        const plan = document.getElementById("plan");
        const current = window.CathayPassenger.id;
        const requestedStage = new URLSearchParams(location.search).get("stage");
        let stageId = "before travel";
        if (requestedStage === "all") stageId = "";
        else if (requestedStage) stageId = STAGES.includes(requestedStage) ? requestedStage : (STAGE_OF[requestedStage] || "before travel");
        let listFilter = "all";
        let replies = new Map();

        async function loadReplies() {
            const response = await fetch(`/api/task-replies?passenger_id=${current}`);
            const body = await response.json();
            if (!response.ok) {
                throw new Error(typeof body.detail === "string" ? body.detail : "Saved answers could not be loaded.");
            }
            replies = new Map((body.replies || []).map((row) => [row.task_key, row.answer]));
        }

        function doneKey(id, key) {
            return `plan-done:${id}:${key}`;
        }

        function ensurePlan() {
            if (plan.querySelector(".trip")) return;
            const stageButtons = STAGES.map((id) => `<button type="button" data-stage="${id}">${STAGE_LABEL[id]}</button>`).join("");
            plan.innerHTML = `
                <article class="trip">
                    <p class="route"></p>
                    <p class="when"></p>
                    <div class="counts" role="group" aria-label="Show tasks or reminders">
                        <button type="button" class="count" data-filter="task"><strong></strong><span></span></button>
                        <button type="button" class="count" data-filter="note"><strong></strong><span></span></button>
                    </div>
                </article>
                <div class="stage-row" role="group" aria-label="Travel stage">${stageButtons}</div>
                <section class="stage custom-scrollbar"></section>`;
            plan.addEventListener("click", (event) => {
                const stageButton = event.target.closest("[data-stage]");
                if (stageButton) {
                    stageId = stageId === stageButton.dataset.stage ? "" : stageButton.dataset.stage;
                    renderPlan();
                    return;
                }
                const filterButton = event.target.closest("[data-filter]");
                if (!filterButton) return;
                listFilter = listFilter === filterButton.dataset.filter ? "all" : filterButton.dataset.filter;
                renderPlan();
            });
            plan.addEventListener("change", (event) => {
                const box = event.target;
                if (!(box instanceof HTMLInputElement) || box.type !== "checkbox") return;
                sessionStorage.setItem(box.dataset.key, box.checked ? "1" : "0");
                settleCard(box.closest(".card"), box.checked);
            });
        }

        function renderPlan() {
            const view = buildPlan(current);
            ensurePlan();
            const counted = (stageId ? view.stages.filter((stage) => stage.id === stageId) : view.stages)
                .flatMap((stage) => stage.items);
            const taskCount = counted.filter((item) => item.kind === "task").length;
            const reminderCount = counted.filter((item) => item.kind === "note").length;
            const stages = stageId ? view.stages.filter((stage) => stage.id === stageId) : view.stages;
            const cards = stages.map((stage) => {
                const items = orderedItems(
                    view.passenger.passenger_id,
                    stage.items.filter((item) => listFilter === "all" || item.kind === listFilter),
                );
                if (!items.length) return "";
                const heading = stageId ? "" : `<h3>${escapeText(stage.label)}</h3>`;
                return heading + items.map((item) => cardHtml(view.passenger.passenger_id, item)).join("");
            }).join("");
            const trip = tripDisplay(view.booking);
            plan.querySelector(".route").textContent = trip.places;
            plan.querySelector(".when").textContent = trip.when;
            const taskButton = plan.querySelector('[data-filter="task"]');
            const noteButton = plan.querySelector('[data-filter="note"]');
            taskButton.querySelector("strong").textContent = String(taskCount);
            taskButton.querySelector("span").textContent = taskCount === 1 ? "task" : "tasks";
            noteButton.querySelector("strong").textContent = String(reminderCount);
            noteButton.querySelector("span").textContent = reminderCount === 1 ? "reminder" : "reminders";
            taskButton.setAttribute("aria-pressed", String(listFilter === "task"));
            noteButton.setAttribute("aria-pressed", String(listFilter === "note"));
            plan.querySelectorAll("[data-stage]").forEach((button) => {
                button.setAttribute("aria-pressed", String(button.dataset.stage === stageId));
            });
            const stage = plan.querySelector(".stage");
            stage.innerHTML = cards || emptyHtml();
        }

        function isDone(passengerId, item) {
            if (item.questions && item.questions.length) return item.questions.every((question) => replies.has(question.key));
            if (item.reply) return replies.has(item.key);
            return sessionStorage.getItem(doneKey(passengerId, item.key)) === "1";
        }

        function dueMs(item) {
            return item.due && item.due.at ? Date.parse(item.due.at) : Number.POSITIVE_INFINITY;
        }

        function orderedItems(passengerId, items) {
            const band = (item) => {
                if (item.kind === "task" && isDone(passengerId, item)) return 2;
                if (item.kind === "task") return 0;
                return 1;
            };
            return items
                .map((item, index) => ({ item, index }))
                .sort((a, b) => {
                    const bandDiff = band(a.item) - band(b.item);
                    if (bandDiff) return bandDiff;
                    if (band(a.item) !== 1) {
                        const timeDiff = dueMs(a.item) - dueMs(b.item);
                        if (timeDiff) return timeDiff;
                    }
                    return a.index - b.index;
                })
                .map((entry) => entry.item);
        }

        function sortCards(list) {
            const cards = [...list.querySelectorAll(".card")];
            const band = (card) => {
                if (card.classList.contains("done")) return 2;
                if (card.dataset.kind === "task") return 0;
                return 1;
            };
            cards
                .map((card, index) => ({ card, index }))
                .sort((a, b) => {
                    const bandDiff = band(a.card) - band(b.card);
                    if (bandDiff) return bandDiff;
                    if (band(a.card) !== 1) {
                        const timeDiff = (Number(a.card.dataset.due) || Number.POSITIVE_INFINITY) - (Number(b.card.dataset.due) || Number.POSITIVE_INFINITY);
                        if (timeDiff) return timeDiff;
                    }
                    return a.index - b.index;
                })
                .forEach((entry) => list.appendChild(entry.card));
        }

        function settleCard(card, checked) {
            const list = card.parentElement;
            const before = new Map([...list.querySelectorAll(".card")].map((el) => [el, el.getBoundingClientRect()]));
            card.classList.toggle("done", checked);
            sortCards(list);
            list.querySelectorAll(".card").forEach((el) => {
                const prev = before.get(el);
                if (!prev) return;
                const dy = prev.top - el.getBoundingClientRect().top;
                if (Math.abs(dy) < 1) return;
                el.animate(
                    [{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }],
                    { duration: 480, easing: "cubic-bezier(.22,.8,.24,1)" }
                );
            });
        }

        function cardHtml(passengerId, item) {
            const key = doneKey(passengerId, item.key);
            const saved = (item.questions || [])
                .map((question) => replyLabel(question.reply, replies.get(question.key) || ""))
                .filter(Boolean)
                .join(" · ");
            const done = isDone(passengerId, item);
            const formHref = `./task-form.html?passenger=${passengerId}&key=${encodeURIComponent(item.key)}&stage=${encodeURIComponent(stageId || "all")}`;
            const check = item.kind !== "task"
                ? ""
                : item.reply
                    ? `<span class="check static ${done ? "on" : ""}" aria-hidden="true"></span>`
                    : `<label class="check"><input type="checkbox" data-key="${key}" ${done ? "checked" : ""} aria-label="Mark done: ${escapeText(item.service)}"></label>`;
            const name = item.link
                ? `<a class="service" href="${item.link.href}" target="_blank" rel="noopener">${escapeText(item.service)}</a>`
                : `<p class="service nolink">${escapeText(item.service)}</p>`;
            const deadline = item.due
                ? `<p class="due-line"><span class="due-left">${escapeText(item.due.left)}</span><span class="due-official">${escapeText(item.due.label)}</span></p>`
                : "";
            const actionText = actionLine(item);
            const answer = saved ? `<p class="answer">${escapeText(saved)}</p>` : "";
            const action = actionText
                ? item.kind === "task" && item.reply
                    ? `<a class="what" href="${formHref}">${escapeText(actionText)}</a>${answer}`
                    : `<p class="what">${escapeText(actionText)}</p>`
                : "";
            const description = item.description
                ? `<details><summary>Service description</summary><p class="desc">${escapeText(item.description)}</p></details>`
                : "";
            const cls = item.gap ? "gap" : item.kind === "note" ? "note" : "";
            const dueAt = item.due && item.due.at ? Date.parse(item.due.at) : "";
            return `<article class="card ${cls} ${done ? "done" : ""}" data-kind="${item.kind}" data-due="${dueAt}">
                <div class="row">${check}<div class="body">
                    ${name}
                    ${deadline}
                    ${action}
                    ${description}
                </div></div>
            </article>`;
        }

        function emptyHtml() {
            const where = stageId ? `in ${STAGE_LABEL[stageId]}` : "on this trip";
            const title = listFilter === "task" ? "No tasks" : listFilter === "note" ? "No reminders" : "Nothing here";
            const note = listFilter === "task"
                ? `Nothing is waiting ${where}.`
                : listFilter === "note"
                    ? `Nothing to keep in mind ${where}.`
                    : stageId
                        ? `${STAGE_LABEL[stageId]} has no tasks or reminders.`
                        : "This trip has no tasks or reminders.";
            return `<div class="empty"><strong>${escapeText(title)}</strong><span>${escapeText(note)}</span></div>`;
        }

        function escapeText(value) {
            return String(value).replace(/[&<>"']/g, (char) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
            }[char]));
        }

        async function initializePlan() {
            let repliesError = "";
            try {
                await loadReplies();
            } catch (error) {
                console.error("Saved answers could not be loaded.", error);
                repliesError = `Saved answers could not be loaded: ${error.message}`;
            }
            try {
                renderPlan();
                if (repliesError) {
                    plan.querySelector(".stage").insertAdjacentHTML("afterbegin", `<p class="meta" role="alert">${escapeText(repliesError)}</p>`);
                }
            } catch (error) {
                console.error("Trip plan could not be displayed.", error);
                plan.innerHTML = `<p class="meta" role="alert">${escapeText(error.message)}</p>`;
                if (repliesError) {
                    plan.insertAdjacentHTML("beforeend", `<p class="meta" role="alert">${escapeText(repliesError)}</p>`);
                }
            }
        }

        initializePlan();
    </script>
</body>
</html>
