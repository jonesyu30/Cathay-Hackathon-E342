<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./plan.css">
</head>
<body class="staff-page">
    <header class="top">
        <div class="brand">
            <img src="https://companieslogo.com/img/orig/0293.HK-ef2d48dd.png?t=1746518351" alt="Cathay Pacific">
            <div>
                <h1>Staff board</h1>
                <p>By flight. Seats, not names.</p>
            </div>
        </div>
        <nav>
            <a href="./plan.html">Passenger plan</a>
            <a href="./staff.html" aria-current="page">Staff board</a>
        </nav>
    </header>
    <main class="wrap wide">
        <p class="banner">Each flight lists seats, not names. The totals are the services those seats need. Filter by a tag to see only those seats.</p>
        <div class="filters" id="filters" role="group" aria-label="Show a tag"></div>
        <div id="board"></div>
    </main>
    <script src="./plan-data.js"></script>
    <script src="./plan-build.js"></script>
    <script src="./staff-roster.js"></script>
    <script>
        const filters = document.getElementById("filters");
        const board = document.getElementById("board");
        const TAG_ORDER = ["WCHC", "WCHS", "WCHR", "Blind", "Deaf", "COG", "ND", "MH", "SEN", "COM", "MED"];
        const GROUP_NAME = {
            COG: "Cognitive Support",
            ND: "Neurodivergence",
            MH: "Mental health & emotional",
            SEN: "Sensory sensitivity",
            COM: "Communication & Language",
            MED: "Medical & Health",
        };
        const TAG_NAME = {
            WCHC: "Wheelchair to the seat",
            WCHS: "Wheelchair to the aircraft door",
            WCHR: "Wheelchair to the gate",
            Blind: "Blind",
            Deaf: "Deaf",
        };
        const SERVICE_WORD = {
            Wheelchair: ["wheelchair", "wheelchairs"],
            "Inflight wheelchair": ["inflight wheelchair", "inflight wheelchairs"],
            Meet: ["meet-and-assist", "meet-and-assist"],
            "Priority board": ["priority boarding", "priority boarding"],
            Briefing: ["briefing", "briefings"],
            Menu: ["menu read-aloud", "menu read-alouds"],
            Cane: ["cane", "canes"],
            "Hearing aid": ["hearing aid", "hearing aids"],
            "Check-in help": ["check-in help", "check-in help"],
            Sunflower: ["sunflower lanyard", "sunflower lanyards"],
            "Sensory Corner": ["Sensory Corner", "Sensory Corner"],
            POC: ["POC", "POC"],
            FREMEC: ["FREMEC", "FREMEC"],
        };
        const SERVICE_ORDER = Object.keys(SERVICE_WORD);
        let tag = "all";

        function escapeText(value) {
            return String(value).replace(/[&<>"']/g, (char) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
            }[char]));
        }

        function tagsInUse() {
            const found = new Set();
            STAFF_FLIGHTS.forEach((flight) => {
                flight.seats.forEach((seat) => {
                    seat.tags.forEach((item) => found.add(item));
                    seat.groups.forEach((item) => found.add(item));
                });
            });
            return TAG_ORDER.filter((item) => found.has(item));
        }

        function seatMatches(seat) {
            if (tag === "all") return true;
            return seat.tags.includes(tag) || seat.groups.includes(tag);
        }

        function sumLabel(name, count) {
            const words = SERVICE_WORD[name] || [name, name];
            return `${count} ${count === 1 ? words[0] : words[1]}`;
        }

        function renderFilters() {
            filters.innerHTML = `<span class="label">Tag</span>`;
            ["all", ...tagsInUse()].forEach((id) => {
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = id === "all" ? "All tags" : id;
                button.title = TAG_NAME[id] || GROUP_NAME[id] || "";
                button.setAttribute("aria-pressed", String(id === tag));
                button.addEventListener("click", () => {
                    tag = id;
                    renderFilters();
                    renderBoard();
                });
                filters.appendChild(button);
            });
        }

        function renderBoard() {
            const html = STAFF_FLIGHTS
                .slice()
                .sort((a, b) => a.departs_at.localeCompare(b.departs_at))
                .map((flight) => {
                    const seats = flight.seats.filter(seatMatches);
                    if (!seats.length) return "";
                    const counts = new Map();
                    seats.forEach((seat) => {
                        seat.services.forEach((name) => counts.set(name, (counts.get(name) || 0) + 1));
                    });
                    const sums = SERVICE_ORDER
                        .filter((name) => counts.has(name))
                        .map((name) => `<span class="sum">${escapeText(sumLabel(name, counts.get(name)))}</span>`)
                        .join("");
                    const rows = seats.map((seat) => {
                        const tags = seat.tags.map((item) => `<span class="chip" title="${escapeText(TAG_NAME[item] || item)}">${escapeText(item)}</span>`).join("");
                        const groups = seat.groups.map((item) => `<span class="chip soft" title="${escapeText(GROUP_NAME[item] || item)}">${escapeText(item)}</span>`).join("");
                        const services = seat.services.map((item) => `<span class="chip soft">${escapeText(item)}</span>`).join("");
                        return `<tr>
                            <td class="seat">${escapeText(seat.seat)}</td>
                            <td><div class="codes">${tags}${groups}</div></td>
                            <td><div class="codes">${services}</div></td>
                        </tr>`;
                    }).join("");
                    const shown = seats.length;
                    const total = flight.seats.length;
                    const countText = tag === "all"
                        ? `${total} ${total === 1 ? "seat" : "seats"}`
                        : `${shown} of ${total} ${total === 1 ? "seat" : "seats"}`;
                    return `<section class="flight">
                        <header class="flight-head">
                            <h2>${escapeText(flight.flight)}</h2>
                            <p>${formatWhen(flight.departs_at)}</p>
                            <p>${escapeText(flight.from)} → ${escapeText(flight.to)}</p>
                            <p>${countText}</p>
                        </header>
                        <div class="sums">${sums}</div>
                        <table class="roster">
                            <thead><tr><th>Seat</th><th>Tags</th><th>Services</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </section>`;
                }).join("");
            board.innerHTML = html || `<p class="meta">No seats with this tag.</p>`;
        }

        renderFilters();
        renderBoard();
    </script>
</body>
</html>
