<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask CARE - Staff Feedback Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cathay-teal: #006564;
            --cathay-dark: #273934;
            --bg: #f3f5f4;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand img {
            height: 26px;
            width: auto;
        }
        .brand h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--cathay-dark);
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        select, button, .back-link {
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            padding: 8px 12px;
        }
        select {
            border: 1px solid #d1d5db;
            background: #fff;
            color: var(--text);
        }
        button {
            border: 1px solid var(--cathay-teal);
            background: var(--cathay-teal);
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #004d4c; }
        .back-link {
            border: 1px solid #d1d5db;
            background: #fff;
            color: var(--text);
            text-decoration: none;
        }
        .back-link:hover { border-color: var(--cathay-teal); color: var(--cathay-teal); }
        main {
            max-width: 1080px;
            margin: 24px auto;
            padding: 0 20px 40px;
            display: grid;
            gap: 20px;
        }
        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
        }
        .kpi-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .kpi-value {
            margin-top: 8px;
            font-size: 28px;
            font-weight: 700;
            color: var(--cathay-dark);
        }
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
        }
        .card h2 {
            margin: 0 0 14px;
            font-size: 16px;
            font-weight: 600;
            color: var(--cathay-dark);
        }
        .bars {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bar-row {
            display: grid;
            gap: 5px;
        }
        .bar-head {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            gap: 12px;
        }
        .bar-label { font-weight: 500; }
        .bar-count { font-weight: 600; color: var(--cathay-teal); }
        .bar-track {
            height: 8px;
            background: #eef2f1;
            border-radius: 999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: var(--cathay-teal);
            border-radius: 999px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        th {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            background: #e6f2f2;
            color: var(--cathay-teal);
        }
        .empty {
            color: var(--muted);
            font-size: 14px;
            margin: 6px 0 0;
        }
        .table-wrap { overflow-x: auto; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="https://companieslogo.com/img/orig/0293.HK-ef2d48dd.png?t=1746518351" alt="Cathay Pacific">
            <h1>Ask CARE — Staff Feedback Insights</h1>
        </div>
        <div class="toolbar">
            <select id="category-filter" aria-label="Filter by category">
                <option value="all">All categories</option>
                <option value="Mobility">Mobility</option>
                <option value="Visual">Visual</option>
                <option value="Hearing">Hearing</option>
                <option value="Cognitive">Cognitive</option>
                <option value="Neurodivergence">Neurodivergence</option>
                <option value="Sensory">Sensory</option>
                <option value="Communication">Communication</option>
                <option value="Medical">Medical</option>
                <option value="Other">Other</option>
            </select>
            <button type="button" id="refresh-btn">Refresh</button>
            <a class="back-link" href="./index.html">Back to Ask CARE</a>
        </div>
    </header>

    <main>
        <section class="kpis">
            <div class="card"><div class="kpi-label">Total Submissions</div><div class="kpi-value" id="kpi-total">0</div></div>
            <div class="card"><div class="kpi-label">Unique Services Requested</div><div class="kpi-value" id="kpi-services">0</div></div>
            <div class="card"><div class="kpi-label">Top Category</div><div class="kpi-value" id="kpi-top-cat" style="font-size: 20px;">—</div></div>
            <div class="card"><div class="kpi-label">Passengers Represented</div><div class="kpi-value" id="kpi-passengers">0</div></div>
        </section>

        <section class="charts">
            <div class="card">
                <h2>Requests by Category</h2>
                <div id="chart-category" class="bars"></div>
            </div>
            <div class="card">
                <h2>Top Preferred Services</h2>
                <div id="chart-service" class="bars"></div>
            </div>
        </section>

        <section class="card">
            <h2>All Passenger Feedback Submissions</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Passenger</th>
                            <th>Category</th>
                            <th>Preferred Service</th>
                            <th>Details</th>
                            <th>Source</th>
                        </tr>
                    </thead>
                    <tbody id="feedback-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const filterEl = document.getElementById("category-filter");
        const refreshBtn = document.getElementById("refresh-btn");

        function esc(value) {
            const div = document.createElement("div");
            div.textContent = value == null ? "" : String(value);
            return div.innerHTML;
        }

        function renderBars(containerId, rows) {
            const el = document.getElementById(containerId);
            if (!rows || !rows.length) {
                el.innerHTML = `<p class="empty">No feedback recorded yet.</p>`;
                return;
            }
            const max = Math.max(...rows.map((r) => r.count), 1);
            el.innerHTML = rows.slice(0, 8).map((row) => `
                <div class="bar-row">
                    <div class="bar-head">
                        <span class="bar-label">${esc(row.label)}</span>
                        <span class="bar-count">${row.count}</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${Math.round((row.count / max) * 100)}%"></div>
                    </div>
                </div>
            `).join("");
        }

        function formatTime(iso) {
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return iso;
            return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        }

        async function loadInsights() {
            const cat = filterEl.value;
            const url = cat && cat !== "all"
                ? `/api/feedback?category=${encodeURIComponent(cat)}`
                : "/api/feedback";
            const tbody = document.getElementById("feedback-tbody");
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("Failed to load feedback");
                const data = await res.json();
                const summary = data.summary || {};
                const items = data.items || [];

                document.getElementById("kpi-total").textContent = summary.total ?? 0;
                document.getElementById("kpi-services").textContent = summary.unique_services ?? 0;
                document.getElementById("kpi-passengers").textContent = summary.unique_passengers ?? 0;
                document.getElementById("kpi-top-cat").textContent =
                    summary.by_category && summary.by_category.length ? summary.by_category[0].label : "—";

                renderBars("chart-category", summary.by_category || []);
                renderBars("chart-service", summary.by_service || []);

                if (!items.length) {
                    tbody.innerHTML = `<tr><td colspan="6" class="empty">No feedback submissions found.</td></tr>`;
                    return;
                }
                tbody.innerHTML = items.map((item) => `
                    <tr>
                        <td>${esc(formatTime(item.created_at))}</td>
                        <td>${esc(item.passenger_name)} (#${item.passenger_id})</td>
                        <td><span class="pill">${esc(item.category)}</span></td>
                        <td><strong>${esc(item.preferred_service)}</strong></td>
                        <td>${esc(item.details || "—")}</td>
                        <td>${esc(item.source_page)}</td>
                    </tr>
                `).join("");
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty">${esc(err.message)}</td></tr>`;
            }
        }

        filterEl.addEventListener("change", loadInsights);
        refreshBtn.addEventListener("click", loadInsights);
        loadInsights();
    </script>
</body>
</html>
